<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kirim Berkas ADL</title><style>body{font-family:Arial;background:#f4f6f8;padding:15px}.card{max-width:650px;margin:auto;background:white;padding:20px;border-radius:16px}label{display:block;margin:15px 0 6px;font-weight:bold}select,input,button{width:100%;box-sizing:border-box;padding:13px;font-size:16px;border:1px solid #ccd3da;border-radius:9px}button{background:#1769e0;color:white;border:0;margin-top:18px}</style><div class="card"><h2>📤 Kirim Berkas Cabang</h2><label>Cabang</label><select id="b"></select><label>Jenis laporan</label><input id="t" placeholder="Contoh: Stock Opname"><label>File</label><input id="f" type="file"><button onclick="send()">Kirim ke Pusat</button><p id="m"></p></div><script>fetch("/api/branches").then(r=>r.json()).then(x=>b.innerHTML=x.branches.map(v=>`<option>${v}</option>`).join(""));async function send(){if(!f.files[0])return m.textContent="Pilih file dulu";let d=new FormData();d.append("branch",b.value);d.append("reportType",t.value||"Berkas");d.append("file",f.files[0]);m.textContent="Mengirim...";let r=await fetch("/api/upload",{method:"POST",body:d}),x=await r.json();m.textContent=x.ok?"✅ File sudah tersimpan.":"❌ "+x.error}</script>

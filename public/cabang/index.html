<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Kirim Berkas</title><style>body{font-family:Arial;background:#f5f6f8;padding:15px}main{max-width:650px;margin:auto;background:white;padding:18px;border-radius:14px}label{display:block;margin-top:14px;font-weight:bold}select,input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:7px;border:1px solid #ccc;border-radius:9px;font-size:16px}button{background:#1677e8;color:white;border:0;font-weight:bold}</style><main><h2>📤 Kirim Berkas ke Pusat</h2><label>Cabang</label><select id=b></select><label>Jenis laporan</label><input id=t placeholder="Contoh: Laporan Penjualan"><label>File</label><input id=f type=file><button onclick=send()>Kirim Berkas</button><p id=m></p></main><script>fetch('/api/branches').then(r=>r.json()).then(x=>x.branches.forEach(v=>b.add(new Option(v,v))));async function send(){let f=document.querySelector('#f').files[0];if(!f)return alert('Pilih file dulu');let d=new FormData;d.append('branch',b.value);d.append('reportType',t.value||'Berkas');d.append('file',f);m.textContent='Mengirim...';let r=await fetch('/api/upload',{method:'POST',body:d});let x=await r.json();m.textContent=x.ok?'✅ Berhasil dikirim ke pusat.':'❌ '+(x.error||'Gagal')}</script>

<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075be8"><title>Status SO Cabang ADL</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f2f6ff}*{box-sizing:border-box}body{margin:0;padding:16px}main{max-width:620px;margin:18px auto;background:#fff;padding:22px;border-radius:20px;box-shadow:0 12px 34px #08265c18}.sub{color:#64748b;line-height:1.5;font-size:14px}label{display:block;font-weight:700;margin-top:16px}select,button{width:100%;padding:14px;margin-top:8px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}button{background:#075be8;color:#fff;border:0;font-weight:700}.status{margin-top:16px;padding:15px;border-radius:12px;line-height:1.5;background:#f1f5f9}.ok{background:#e6f7ed;color:#166534}.wait{background:#fff0e8;color:#9a3412}.error{color:#b91c1c}.note{font-size:12px;color:#64748b;margin-top:16px}
</style></head><body><main><h1>📋 Status File SO</h1><p class="sub">Periksa apakah cabang sudah mengirim File SO pada bulan ini. Halaman ini terpisah; halaman kirim berkas lama tidak diubah.</p>
<label for="branch">Pilih cabang</label><select id="branch"><option value="">Memuat daftar cabang...</option></select>
<div id="status" class="status" role="status">Memuat status...</div><button id="refresh" type="button">Periksa lagi</button><p class="note">Status dihitung dari berkas kategori File SO yang tersimpan pada bulan terpilih. Riwayat bulan sebelumnya tetap disimpan.</p></main>
<script>
const $=id=>document.getElementById(id);
const monthKey=()=>{const d=new Date();return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'};
function setStatus(text,cls='status'){$('status').className='status '+cls;$('status').textContent=text}
async function loadBranches(){try{const r=await fetch('/api/branches',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const x=await r.json();if(!Array.isArray(x.branches))throw Error('Daftar cabang tidak tersedia');$('branch').innerHTML='<option value="">Pilih cabang...</option>'+x.branches.map(b=>'<option value="'+String(b).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'">'+String(b).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</option>').join('')}catch(e){$('branch').innerHTML='<option value="">Gagal memuat cabang</option>';setStatus('Gagal memuat daftar cabang. Buka melalui website ADL.','error')}}
async function check(){const branch=$('branch').value;if(!branch){setStatus('Pilih cabang terlebih dahulu.');return}setStatus('Memeriksa berkas bulan ini...');$('refresh').disabled=true;try{const r=await fetch('/api/inbox',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const x=await r.json();if(!x.ok)throw Error(x.error||'Gagal membaca berkas');const found=(x.files||[]).some(f=>f.branch===branch&&String(f.key||'').startsWith(monthKey())&&['file_so','file so','fileso'].includes(String(f.reportType||'').trim().toLowerCase()));const d=new Date();const label=d.toLocaleDateString('id-ID',{month:'long',year:'numeric'});setStatus(found?'✓ '+branch+' SUDAH mengirim File SO untuk '+label+'.':'! '+branch+' BELUM mengirim File SO untuk '+label+'.',found?'ok':'wait')}catch(e){setStatus('Gagal memeriksa: '+e.message,'error')}finally{$('refresh').disabled=false}}
$('branch').addEventListener('change',check);$('refresh').addEventListener('click',check);loadBranches();setInterval(()=>{if($('branch').value)check()},30000);
</script></body></html>

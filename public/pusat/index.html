<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Pusat ADL</title><style>body{font-family:Arial;background:#f5f6f8;padding:15px}main{max-width:850px;margin:auto}.c{background:white;padding:15px;margin:10px 0;border-radius:12px}small{color:#666}a{display:inline-block;margin-top:8px}</style><main><h2>📥 Pusat Berkas ADL</h2><div id=l>Memuat...</div></main><script>async function load(){let r=await fetch('/api/inbox'),x=await r.json();if(!x.ok){l.textContent='Gagal: '+x.error;return}l.innerHTML=x.files.length?x.files.map(f=>`<div class=c><b>${f.branch}</b><div>${f.reportType}</div><small>${f.name} · ${f.modified||''}</small><br><a href="/api/download?key=${encodeURIComponent(f.key)}">⬇️ Download</a></div>`).join(''):'Belum ada berkas.'}load();setInterval(load,30000)</script>

<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pusat ADL</title><style>body{font-family:Arial;background:#f4f6f8;padding:15px}.card{max-width:850px;margin:10px auto;background:white;padding:16px;border-radius:14px}.tag{background:#e8f1ff;color:#1769e0;padding:5px;border-radius:20px}.btn{display:inline-block;background:#1769e0;color:white;padding:9px 12px;border-radius:8px;text-decoration:none;margin-top:8px}</style><h2>🏢 Pusat ADL</h2><div id="list">Memuat...</div><script>async function load(){let x=await(await fetch("/api/inbox")).json();list.innerHTML=x.ok?x.files.map(f=>`<div class="card"><b>${f.originalName||"File"}</b> <span class="tag">${f.branch||""}</span><p>${f.reportType||"Berkas"} · ${f.receivedAt||""}</p><a class="btn" href="/api/download?key=${encodeURIComponent(f.key)}">Download</a></div>`).join("")||"<div class=card>Belum ada berkas.</div>":x.error}load();setInterval(load,30000)</script>

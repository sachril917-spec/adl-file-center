<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADL KIRIM</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f4f6f8;color:#17202a}header{background:#1769aa;color:#fff;padding:16px;font-size:21px;font-weight:bold}main{max-width:620px;margin:auto;padding:16px}.c{background:#fff;padding:18px;border-radius:14px;box-shadow:0 2px 10px #0001}label{display:block;font-weight:bold;margin:12px 0 6px}input,select,button{width:100%;padding:13px;border-radius:9px;border:1px solid #ccd5dd;font-size:15px}button{background:#1769aa;color:#fff;border:0;font-weight:bold;margin-top:12px}.wa{background:#168a45}.s{margin-top:12px;padding:12px;border-radius:9px;white-space:pre-wrap}.ok{background:#e8f7ed;color:#146b37}.err{background:#fdeaea;color:#9a1c1c}.p{height:8px;background:#e4e8ec;border-radius:10px;margin-top:12px;overflow:hidden}.b{height:100%;width:0;background:#1769aa}</style>
<header>ADL KIRIM</header><main><div class="c"><h2>Kirim Dokumen</h2><label>Cabang</label><select id="branch"></select><label>Jenis laporan</label><input id="report" placeholder="Contoh: Stock Opname"><label>File</label><input id="file" type="file" accept=".xlsx,.xls,.docx,.doc,.pdf,.jpg,.jpeg,.png,.zip"><div class="p"><div id="bar" class="b"></div></div><button id="send" onclick="go()">KIRIM KE PUSAT</button><div id="st" class="s" style="display:none"></div><button id="wa" class="wa" style="display:none" onclick="share()">BAGIKAN VIA WHATSAPP</button></div></main>
<script>
const bs=["ADL Talang","ADL Karanganyar","ADL Brebes","ADL Tanglog","ADL Bumiayu","ADL Gumayun","Rizky Pustaka","ADL Kaligelnag","ADL Kaliwungu","ADL Weleri","ADL Kedungwuni","Toko Foto FC Dicky","ADL Ketanggungan","ADL Debong","ADL Mejasem","ADL Ajibarang","ADL Bandar"];bs.forEach(x=>branch.add(new Option(x,x)));let msg="";
function go(){const f=file.files[0];if(!f)return alert("Pilih file.");send.disabled=true;send.textContent="MENGUPLOAD...";st.style.display="block";st.className="s";st.textContent="Mengupload 0%";bar.style.width="0%";const q=new FormData();q.append("branch",branch.value);q.append("report",report.value);q.append("file",f);const x=new XMLHttpRequest();x.open("POST","/api/upload");x.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);bar.style.width=p+"%";st.textContent="Mengupload "+p+"%"}};x.onload=()=>{send.disabled=false;send.textContent="KIRIM KE PUSAT";if(x.status>=200&&x.status<300){const d=JSON.parse(x.responseText);msg=`Laporan ${d.report||"Dokumen"}\nCabang: ${d.branch}\nFile: ${d.originalName}\nDiterima pusat: ${new Date(d.received).toLocaleString("id-ID")}\nSTATUS: FILE SUDAH MASUK PUSAT`;st.className="s ok";st.textContent=msg;bar.style.width="100%";wa.style.display="block";file.value="";report.value=""}else{st.className="s err";st.textContent="Gagal mengirim."}};x.onerror=()=>{send.disabled=false;send.textContent="KIRIM KE PUSAT";st.className="s err";st.textContent="Server tidak dapat dihubungi."};x.send(q)}
function share(){location.href="https://wa.me/?text="+encodeURIComponent(msg)}
</script></html>

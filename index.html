<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADL CENTER</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f4f6f8;color:#17202a}header{background:#1769aa;color:#fff;padding:16px;font-size:21px;font-weight:bold}main{max-width:1100px;margin:auto;padding:14px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.c{background:#fff;border-radius:13px;padding:15px;box-shadow:0 2px 8px #0001}.stat span{font-size:13px;color:#555}.stat b{display:block;font-size:20px;margin-top:7px}.blue{color:#1769aa}.red{color:#b00020}.green{color:#087a39}.c{margin-top:14px}.filter{display:flex;gap:8px}.filter input,.filter button{padding:11px;border-radius:8px;border:1px solid #ccd5dd}.filter button{background:#1769aa;color:white;border:0}.list{display:grid;gap:10px;margin-top:12px}.item{border:1px solid #e4e8ec;border-radius:10px;padding:12px}.top{display:flex;justify-content:space-between}.small{font-size:12px;color:#68737d;margin-top:4px}.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.money div{background:#f7f9fb;padding:8px;border-radius:8px;font-size:12px}.money b{display:block;margin-top:4px}.actions{display:flex;gap:7px;margin-top:10px}.actions button,.actions a{background:#1769aa;color:white;border:0;border-radius:7px;padding:9px 10px;text-decoration:none;font-size:13px}.detail{margin-top:14px;background:#f8fafc;border-left:4px solid #1769aa;padding:13px;white-space:pre-wrap;line-height:1.6}@media(max-width:700px){.g{grid-template-columns:repeat(2,1fr)}.money{grid-template-columns:1fr}.top{display:block}}</style>
<header>ADL CENTER - PUSAT</header><main><div class="g"><div class="stat"><span>Dokumen</span><b id="n">0</b></div><div class="stat"><span>Total Rp. Akhir</span><b id="a" class="blue">Rp 0</b></div><div class="stat"><span>Total Minus</span><b id="m" class="red">Rp 0</b></div><div class="stat"><span>Total Plus</span><b id="p" class="green">Rp 0</b></div></div>
<div class="c"><h2>Laporan Masuk</h2><div class="filter"><input id="month" type="month"><button onclick="load()">Refresh</button></div><div id="list" class="list"></div></div>
<div class="c"><h2>Detail Laporan</h2><div id="detail" class="detail">Pilih laporan untuk melihat detail.</div></div></main>
<script>month.value=new Date().toISOString().slice(0,7);let data=[];const rp=x=>"Rp "+Number(x||0).toLocaleString("id-ID");async function load(){const r=await fetch("/api/inbox?month="+month.value);data=await r.json();n.textContent=data.length;a.textContent=rp(data.reduce((s,x)=>s+(x.parsed?.akhir||0),0));m.textContent=rp(data.reduce((s,x)=>s+(x.parsed?.minus||0),0));p.textContent=rp(data.reduce((s,x)=>s+(x.parsed?.plus||0),0));list.innerHTML=data.length?data.map((x,i)=>`<div class="item"><div class="top"><b>${x.branch}</b><span class="small">${new Date(x.received).toLocaleString("id-ID")}</span></div><div class="small">${x.originalName}</div><div class="money"><div>Total Akhir<b class="blue">${rp(x.parsed?.akhir)}</b></div><div>Minus<b class="red">${rp(x.parsed?.minus)}</b></div><div>Plus<b class="green">${rp(x.parsed?.plus)}</b></div></div><div class="actions"><button onclick="show(${i})">Lihat Detail</button><a href="/api/download/${x.id}">Download</a></div></div>`).join(""):'<div class="detail">Belum ada laporan bulan ini.</div>'}function show(i){const x=data[i],q=x.parsed||{};detail.textContent=`Cabang: ${x.branch}\nFile: ${x.originalName}\nDiterima: ${new Date(x.received).toLocaleString("id-ID")}\n\nTotal Rp. Akhir: ${rp(q.akhir)}\nTotal Minus: ${rp(q.minus)}\nTotal Plus: ${rp(q.plus)}\nSelisih Bersih: ${rp((q.plus||0)-(q.minus||0))}\nStatus: ${q.status||"Selesai"}\n\n${(q.lines||[]).length?"Data terdeteksi:\\n"+q.lines.join("\\n"):""}`}load();setInterval(load,5000)</script></html>
